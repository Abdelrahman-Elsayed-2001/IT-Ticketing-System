{% extends 'base.html' %}

{% block content %}
<div class="dashboard-header">
    <h1>{{ t('Profile') }} - {{ current_user.username }} ({{ current_user.localized_name }})</h1>
</div>

<div class="card" style="max-width: 900px; margin: 0 auto;">
    <div style="display: flex; flex-wrap: wrap; gap: 30px;">
        <div style="flex: 1 1 300px;">
            <form method="POST" action="{{ url_for('main.profile') }}">
                <div class="form-group">
                    <label>{{ t('Email') }}</label>
                    <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}">
                </div>
                <div class="form-group">
                    <label>{{ t('Mobile Number (Whatsapp)')}}</label>
                    <input type="text" name="mobile_number" class="form-control"
                        value="{{ current_user.mobile_number or '' }}" pattern="^(05\d{8}|2001)$" maxlength="10"
                        title="{{ t('Must be 10 digits starting with 05') }}">
                </div>
                <div class="form-group">
                    <label>{{ t('Avaya Extension') }}</label>
                    <input type="text" name="avaya_extension" class="form-control"
                        value="{{ current_user.avaya_extension or '' }}">
                </div>
                {% if current_user.role == 'IT' %}
                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" name="is_mobile_public" id="is_mobile_public" {% if
                        current_user.is_mobile_public %}checked{% endif %} style="width: auto;">
                    <label for="is_mobile_public" style="margin: 0;">{{ t('Make Mobile Public') }}</label>
                </div>

                {% endif %}
                <div class="form-group">
                    <label>{{ t('Change Password (leave blank to keep current)') }}</label>
                    <input type="password" name="password" class="form-control">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">{{ t('Update') }}</button>
                </div>
            </form>
            <form method="POST" action="{{ url_for('main.profile') }}" style="margin-top: 10px;">
                <input type="hidden" name="action" value="skip">
                <button type="submit" class="btn btn-secondary w-100">{{ t('Skip') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
